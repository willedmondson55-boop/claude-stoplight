<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        width: 240px;
        background: #14171f;
        color: #e5e7eb;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 14px 10px;
      }
      #dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #9ca3af;
        flex: none;
      }
      #label {
        font-size: 16px;
        font-weight: 600;
      }
      #duration {
        margin-left: auto;
        font-size: 12px;
        color: #9ca3af;
        font-variant-numeric: tabular-nums;
      }
      #detail {
        padding: 0 14px 6px;
        font-size: 12px;
        color: #b6bcc8;
        line-height: 1.4;
        word-break: break-word;
        min-height: 17px;
      }
      #session {
        padding: 0 14px 10px;
        font-size: 11px;
        color: #6b7280;
        font-family: ui-monospace, monospace;
        word-break: break-all;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-top: 1px solid #262b36;
        font-size: 13px;
      }
      .row a {
        color: #8ab4f8;
        text-decoration: none;
        font-size: 12px;
      }
      /* Toggle switch */
      .switch {
        position: relative;
        width: 34px;
        height: 20px;
        flex: none;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        background: #3a4050;
        border-radius: 20px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .slider::before {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        left: 2px;
        top: 2px;
        border-radius: 50%;
        background: #e5e7eb;
        transition: transform 0.15s;
      }
      .switch input:checked + .slider {
        background: #22c55e;
      }
      .switch input:checked + .slider::before {
        transform: translateX(14px);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div id="dot"></div>
      <div id="label">…</div>
      <div id="duration"></div>
    </div>
    <div id="detail"></div>
    <div id="session"></div>
    <div class="row">
      <span>Show overlay</span>
      <label class="switch">
        <input type="checkbox" id="overlay-toggle" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <a href="#" id="open-options">Options</a>
    </div>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
